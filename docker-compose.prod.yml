# 生产部署（无认证直连版，仅自用）
#
#   cp config.example.json config.json    # 填 ai.api_key
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 直接发布 8770 端口，浏览器访问 http://<服务器IP>:8770
# 注意：没有密码认证 —— 知道 IP 的人就能打开控制台并消耗你的模型额度。

services:
  app:
    build:
      context: .
      args:
        WITH_AKSHARE: "0"     # 需要财报/龙虎榜时改 1（镜像更大，构建更慢）
        # 国内服务器必须给镜像源，否则 pip 装 pandas 会慢到超时
        PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
    image: astock-watch:latest
    container_name: astock-core
    mem_limit: 1536m        # 容器内存上限（曾多次 OOM → 502）
    memswap_limit: 2g
    restart: unless-stopped

    ports:
      - "8770:8770"

    environment:
      TZ: Asia/Shanghai
      PORT: "8770"

    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ./backups:/app/backups

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8770/api/overview',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      start_period: 25s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
